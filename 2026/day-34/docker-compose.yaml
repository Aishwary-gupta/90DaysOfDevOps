version: "3.9"

services:

  web:
    build: ./app
    container_name: flask-app

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: on-failure

    networks:
      - backend

    labels:
      app: flask

  postgres:

    image: postgres:16

    container_name: postgres-db

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: always

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - backend

    labels:
      app: postgres

  redis:

    image: redis:latest

    container_name: redis-cache

    restart: always

    networks:
      - backend

    labels:
      app: redis

volumes:

  postgres-data:

networks:

  backend: